[package]
name = "busbar-transport-grpc"
version = "1.6.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The gRPC transport: gRPC calls over HTTP/2, dialled and accepted, as a sans-IO framer."
license = "Apache-2.0"

[lib]
name = "busbar_transport_grpc"
path = "src/lib.rs"
# rlib: the linked door and the tests. The dropped-in door is the plugin crate's cdylib
# (`busbar-transport-grpc-plugin`), the same table exported as the one door symbol.
crate-type = ["rlib"]

[dependencies]
# The only busbar crate this plugin names (#40(a)). Pinned by git rev to the busbar commit in
# `.busbar-ref`. Its `hyper_io!` SDK macro is the sans-IO drive
# this framer runs `hyper` on, expanded here over this crate's own `hyper` and `bytes`.
busbar-contract = { workspace = true }
# HTTP/2 is `hyper`'s (the owner's PLUGIN LIBRARIES ruling: a prebuilt library, driven over the
# host's bytes); gRPC's own layer — the length-prefixed message, grpc-timeout, grpc-status — is
# this crate's.
hyper = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
bytes = { workspace = true }
# HTTP/2's own error codes: a far end's RST_STREAM code, read off the error `hyper` hands up
# (`std::error::Error::source`), is mapped to its gRPC status. The same `h2` `hyper` runs on.
h2 = { workspace = true }
# The door's settings blob is JSON.
serde_json = { workspace = true }
# A head block may carry an auth's credential lines: the copies this framer owns are wiped.
zeroize = { workspace = true }

[dev-dependencies]
# THE DOOR'S BEHAVIOUR, BOTH WAYS IN (`tests/door.rs`): the shipped dropped-in image, the plugin
# crate's cdylib, loaded beside the linked door.
libloading = { workspace = true }
# THE REAL PEERS (`tests/peers.rs`): tonic servers and clients on real sockets, over cleartext and
# over TLS, with this door on the other end through a test host that carries the socket's bytes.
tonic = { version = "0.14", default-features = false, features = ["server", "channel", "router", "codegen"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true, features = ["default"] }
hyper-util = { workspace = true }
tower = { workspace = true }
futures = { workspace = true }
